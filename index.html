<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>简单计时器</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Adjusting the container div to align left with 50px margin from the screen edge -->
    <div class="container1" style="left: 50px;">
      <!-- Beautifying the vertical links section -->
      <div style="margin: 20px; padding: 10px; border: 1px solid #ccc; border-radius: 8px; background-color: #f9f9f9; width: 150px;">
        <a href="https://dayofai.sicilyhuang.top" target="_blank" style="display: block; margin: 5px 0; text-decoration: none; color: #007BFF; font-weight: bold;">Day of AI 课程</a>
      </div>
      <div style="margin: 20px; padding: 10px; border: 1px solid #ccc; border-radius: 8px; background-color: #f9f9f9; width: 150px;">
        <a href="https://howtoai.sicilyhuang.top" target="_blank" style="display: block; margin: 5px 0; text-decoration: none; color: #007BFF; font-weight: bold;">How to AI 课程</a>
      </div>
      <div style="margin: 20px; padding: 10px; border: 1px solid #ccc; border-radius: 8px; background-color: #f9f9f9; width: 150px;">
        <a href="https://film-page.sicilyhuang.top" target="_blank" style="display: block; margin: 5px 0; text-decoration: none; color: #007BFF; font-weight: bold;">电影网站</a>
      </div>
    </div>
    
    <div class="container2">
        <div class="timer">
            <div class="time-display">
                <span id="minutes">00</span>:
                <span id="seconds">00</span>:
                <span id="milliseconds">00</span>
            </div>
            <div class="controls">
                <button id="startBtn" class="btn">开始</button>
                <button id="pauseBtn" class="btn" disabled>暂停</button>
                <button id="resetBtn" class="btn">重置</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
