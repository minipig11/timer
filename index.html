<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>网站导航</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Adjusting the container div to align left with 50px margin from the screen edge -->
    <div class="container1" style="left: 50px;">
    
      <!-- Adding a Sicily Island icon -->
      <div style="margin: 20px; text-align: center;">
        <img src="https://ts1.tc.mm.bing.net/th/id/R-C.11d288bc8551f1f0a939b02f812889b3?rik=oeMUTQrD4MdOoA&riu=http%3a%2f%2fimg.daimg.com%2fuploads%2fallimg%2f200812%2f1-200Q2235411.jpg&ehk=UOhCFPVky42oc%2bJ%2fnc1jYu7Cm6cvqPMrm47BDRL4GGE%3d&risl=&pid=ImgRaw&r=0" alt="西西里岛" style="width: 100px; height: auto; border-radius: 10%;">
        <!--<p style="font-size: 1rem; color: #333; font-weight: bold;">西西里岛</p>-->
      </div>
        
      <!-- Beautifying the vertical links section -->
      <div style="margin: 20px; padding: 10px; border: 1px solid #ccc; border-radius: 8px; background-color: #f9f9f9; width: 150px;">
        <a href="https://dayofaicurriculum.sicilyhuang.top" target="_blank" style="display: block; margin: 5px 0; text-decoration: none; color: #007BFF; font-weight: bold;">Day of AI 课程</a>
      </div>
      <div style="margin: 20px; padding: 10px; border: 1px solid #ccc; border-radius: 8px; background-color: #f9f9f9; width: 150px;">
        <a href="https://howtoai.sicilyhuang.top" target="_blank" style="display: block; margin: 5px 0; text-decoration: none; color: #007BFF; font-weight: bold;">How to AI 课程</a>
      </div>
      <div style="margin: 20px; padding: 10px; border: 1px solid #ccc; border-radius: 8px; background-color: #f9f9f9; width: 150px;">
        <a href="https://film-page.sicilyhuang.top" target="_blank" style="display: block; margin: 5px 0; text-decoration: none; color: #007BFF; font-weight: bold;">电影网站</a>
      </div>
      
    </div>
    
    <div class="container2">
        <div class="timer">
            <div class="time-display">
                <span id="minutes">00</span>:
                <span id="seconds">00</span>:
                <span id="milliseconds">00</span>
            </div>
            <div class="controls">
                <button id="startBtn" class="btn">开始</button>
                <button id="pauseBtn" class="btn" disabled>暂停</button>
                <button id="resetBtn" class="btn">重置</button>
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
